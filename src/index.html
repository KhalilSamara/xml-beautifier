<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>XML Beautifier</title>
<link rel="icon" id="favicon" href="data:,">
<style>
/*@TOKENS*/
/*@CSS*/
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="8" y="8" width="48" height="48" rx="13" fill="var(--accent)"/>
        <g fill="none" stroke="var(--bg)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22.5 23.5 15 32l7.5 8.5"/><path d="M35.5 21.5 28.5 42.5"/><path d="M41.5 23.5 49 32l-7.5 8.5"/>
        </g>
      </svg>
      <span class="name">XML Beautifier</span>
    </div>
    <span class="divider" aria-hidden="true"></span>
    <span class="flag" aria-hidden="true">&#8722;f</span>
    <button id="jobField" class="jobfield" type="button" aria-label="Error XML file"><span class="jn" id="jobName"></span><span class="js" id="jobSize"></span></button>
    <div class="actions">
      <button id="openBtn" class="btn" type="button" title="Open file"><svg class="i" viewBox="0 0 24 24"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg><span class="bl">Open</span></button>
      <button id="copyBtn" class="btn" type="button" disabled title="Copy shown samples"><svg class="i" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg><span class="bl">Copy</span></button>
      <button id="dlBtn" class="btn primary" type="button" disabled title="Download shown samples"><svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg><span class="bl">Download</span></button>
      <button id="gearBtn" class="gear" type="button" aria-label="Settings" aria-haspopup="dialog"><svg class="i" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <input type="file" id="fileInput" accept=".xml,.jtl,text/xml,application/xml" hidden>
  </header>

  <main class="work" id="work">
    <section class="inpane" id="inPane" aria-label="Input">
      <div class="panehead">
        <span class="fname">input</span>
        <span class="meta" id="inMeta"></span>
        <span class="err" id="pasteErr" role="alert" hidden></span>
        <div class="outtools">
          <button id="clearBtn" class="ib" type="button" title="Clear input" aria-label="Clear input" disabled><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          <button id="hideIn" class="ib" type="button" title="Hide input" aria-label="Hide input"><svg class="i" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg></button>
        </div>
      </div>
      <div class="inbody">
        <textarea id="paste" class="editor" spellcheck="false" autocomplete="off" wrap="off" aria-label="Paste XML"></textarea>
        <div id="pasteNote" class="empty" hidden><p id="pasteNoteMsg"></p></div>
      </div>
    </section>
    <div id="split" class="split" role="separator" aria-orientation="vertical" aria-label="Resize input and output" tabindex="0" aria-valuemin="20" aria-valuemax="80"></div>

    <section class="out" aria-label="Output">
      <div class="outhead">
        <button id="showIn" class="ib" type="button" title="Show input" aria-label="Show input" hidden><svg class="i" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg></button>
        <span class="fname" id="outName">output</span>
        <span class="meta" id="meta" aria-live="polite"></span>
        <span class="flags" id="flags"></span>
        <div class="outtools">
          <button id="expandAll" class="ib" type="button" title="Expand all" aria-label="Expand all" disabled><svg class="i" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg></button>
          <button id="collapseAll" class="ib" type="button" title="Collapse all" aria-label="Collapse all" disabled><svg class="i" viewBox="0 0 24 24"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></svg></button>
        </div>
      </div>
      <div class="filterbar" id="filterBar" hidden>
        <div class="pfx"><label class="pfx-l" for="find">find</label><input id="find" class="pfx-i" type="text" spellcheck="false" autocomplete="off"></div>
        <div class="dd" id="codesBox" hidden>
          <button id="codesBtn" class="btn sm" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="codesPop"><span id="codesLbl">All codes</span><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
          <div id="codesPop" class="pop" role="group" aria-label="Response codes" hidden><div id="codes"></div></div>
        </div>
        <label class="check"><input type="checkbox" id="txRows"> Transaction rows</label>
      </div>
      <div id="scroller" class="well">
        <div id="empty" class="empty"><svg class="i" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><p id="emptyMsg">Drop an error XML or paste it.</p></div>
        <div id="list" class="list" role="list"></div>
      </div>
    </section>
  </main>
</div>

<div id="drop" class="drop" hidden><div>Drop XML</div></div>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <header>
    <h2 id="drawerTitle">Settings</h2>
    <button id="drawerClose" class="ib" type="button" aria-label="Close settings"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </header>
  <div class="field">
    <span class="lbl" id="indLbl">Indent</span>
    <div class="seg" role="group" aria-labelledby="indLbl" data-setting="indent">
      <button type="button" data-v="2">2</button><button type="button" data-v="4">4</button>
    </div>
  </div>
  <div class="field">
    <span class="lbl" id="attLbl">Attributes</span>
    <div class="seg" role="group" aria-labelledby="attLbl" data-setting="attrs">
      <button type="button" data-v="inline">Inline</button><button type="button" data-v="stacked">Stacked</button>
    </div>
  </div>
  <label class="check"><input type="checkbox" data-setting="wrap"> Wrap long lines</label>
  <label class="check"><input type="checkbox" data-setting="empty"> Empty elements</label>
  <label class="check"><input type="checkbox" data-setting="unescape"> Decode \u escapes in JSON</label>
  <div class="foot">
    <button id="resetBtn" class="btn sm" type="button">Reset settings</button>
    <p class="note">Settings persist in this browser.</p>
  </div>
</aside>

<script id="core">
/*@CORE*/
</script>
<script>
/*@APP*/
</script>
</body>
</html>
