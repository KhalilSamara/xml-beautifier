<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>XML Beautifier</title>
<link rel="icon" id="favicon" href="data:,">
<style>
/* The only place the tool's identity colours are defined. */
:root {
  --accent: #F2646E;
  --accent-hover: #F47A80;
  --accent-pressed: #E0525C;
  --accent-text: #F7868D;
  /* Error is orange in this tool: the red accent sits 1.04:1 from suite red #FF6E67. */
  --error: #FF9147;

  --bg: #2B2B2B;
  --topbar: #313335;
  --surface: #3C3F41;
  --well: #212223;
  --text: #D6D6D6;
  --text-2: #9AA0A0;
  --text-2-on-surface: #A6ACAC;
  --text-3: #7C8282;
  --border: #4F5355;
  --sep: #34383A;
  --success: #6EBF6E;
  --amber: #D7BA7D;
  --green: #9CC28A;
  --flag: #969C9C;
  --gear: #8A9090;

  --r-s: 4px;
  --r-m: 6px;
  --r-l: 10px;

  --fs-1: 11px;
  --fs-2: 12px;
  --fs-3: 13px;
  --fs-4: 15px;
  --fs-5: 19px;

  --sans: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: var(--fs-3)/1.45 var(--sans);
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { display: flex; flex-direction: column; height: 100vh; }

/* ---------- topbar (suite header standard) ---------- */
.topbar {
  flex: none; display: flex; align-items: center; gap: 12px;
  height: 52px; padding: 0 16px;
  background: var(--topbar); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; flex: none; }
.logo { width: 25px; height: 25px; display: block; }
.name { font-size: var(--fs-4); font-weight: 700; color: var(--text); white-space: nowrap; }
.divider { width: 1px; height: 22px; background: var(--border); flex: none; }
.flag { font: var(--fs-3) var(--mono); color: var(--flag); flex: none; }
.jobfield {
  flex: 1 1 auto; min-width: 0; height: 30px; padding: 0 10px;
  background: var(--bg); border: 0; border-radius: var(--r-m);
  box-shadow: inset 0 -1px 0 var(--sep);
  font: var(--fs-3) var(--mono); color: var(--text); text-align: left;
  display: flex; align-items: center; gap: 12px; overflow: hidden;
}
.jobfield .jn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jobfield .js { color: var(--text-2); white-space: nowrap; flex: none; }
.actions { display: flex; align-items: center; gap: 8px; flex: none; }
.btn {
  height: 34px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px;
  border-radius: var(--r-m); font-size: var(--fs-3); font-weight: 600; white-space: nowrap;
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  transition: background-color 120ms, border-color 120ms, color 120ms;
}
.btn:hover { background: #45494B; }
.btn:disabled { color: var(--text-3); cursor: default; background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.primary:active { background: var(--accent-pressed); border-color: var(--accent-pressed); }
.btn.primary:disabled { background: var(--surface); border-color: var(--border); color: var(--text-3); }
.btn.ok, .btn.ok:hover { color: var(--success); }
.btn.primary.ok { color: var(--bg); }
.gear {
  width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
  background: none; border: 0; color: var(--gear); border-radius: var(--r-m); flex: none;
}
.gear svg.i { width: 18px; height: 18px; }
.gear:hover { color: var(--text); }

/* ---------- workspace: input | divider | output ---------- */
.work { flex: 1 1 auto; min-height: 0; display: flex; }
.inpane { flex: 0 0 var(--inw, 40%); min-width: 240px; display: flex; flex-direction: column; background: var(--well); }
.work.nosplit .inpane, .work.nosplit .split { display: none; }
.panehead, .outhead {
  flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  min-height: 40px; padding: 6px 8px 6px 16px; background: var(--well); border-bottom: 1px solid var(--sep);
  font: var(--fs-2) var(--mono);
}
.outhead #showIn { margin-left: -8px; }
.panehead .err { font-family: var(--sans); }
.inbody { flex: 1 1 auto; min-height: 0; position: relative; }
.editor {
  position: absolute; inset: 0; width: 100%; height: 100%; resize: none; border: 0; margin: 0;
  padding: 8px 16px; background: var(--well); color: var(--text);
  font: var(--fs-3)/20px var(--mono); white-space: pre; tab-size: 2;
}
.editor:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.split {
  flex: none; width: 8px; margin: 0 -4px; z-index: 2; cursor: col-resize; position: relative;
  background: transparent;
}
.split::before { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: var(--border); transition: background-color 120ms, width 120ms, left 120ms; }
.split:hover::before, .split.drag::before, .split:focus-visible::before { left: 2px; width: 4px; background: var(--accent); }
.split:focus-visible { outline: none; }
body.resizing { cursor: col-resize; user-select: none; }
.field { margin-bottom: 12px; }
.lbl { display: block; font-size: var(--fs-2); color: var(--text-2); margin-bottom: 4px; }
.err { color: var(--error); font-size: var(--fs-2); }
.btn.sm { height: 28px; padding: 0 8px 0 12px; font-weight: 500; font-size: var(--fs-2); gap: 4px; }

/* filter bar */
.filterbar {
  flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 8px 8px 16px; background: var(--well); border-bottom: 1px solid var(--sep);
}
.pfx { display: flex; height: 28px; flex: 0 1 320px; min-width: 160px; }
.pfx-l {
  display: flex; align-items: center; padding: 0 8px; font: var(--fs-2) var(--mono); color: var(--text-2-on-surface);
  background: #45494B; border: 1px solid var(--border); border-right: 0; border-radius: var(--r-m) 0 0 var(--r-m);
}
.pfx-i {
  flex: 1; min-width: 0; height: 28px; padding: 0 8px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 0 var(--r-m) var(--r-m) 0; font: var(--fs-3) var(--mono); color: var(--text);
}
.pfx-i:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.dd { position: relative; }
.pop {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 10; min-width: 300px; max-height: 60vh; overflow-y: auto;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-m); padding: 8px 12px;
  box-shadow: 0 4px 12px rgba(0,0,0,.35);
}
.check { display: flex; align-items: center; gap: 8px; min-height: 28px; cursor: pointer; font-size: var(--fs-3); }
.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); flex: none; cursor: pointer; }
.coderow { display: grid; grid-template-columns: 16px auto 1fr auto; align-items: center; gap: 8px; min-height: 28px; cursor: pointer; }
.coderow input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.coderow .c { font: var(--fs-3) var(--mono); color: var(--accent-text); }
.coderow .m { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.coderow .n { font: var(--fs-2) var(--mono); color: var(--amber); }
.coderow.all .c { color: var(--text); font-family: var(--sans); }
.coderow.all { border-bottom: 1px solid var(--sep); margin-bottom: 4px; padding-bottom: 4px; }

/* ---------- output ---------- */
.out { flex: 1 1 auto; min-width: 320px; display: flex; flex-direction: column; background: var(--bg); }
.fname { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }
.meta { color: var(--text-2); }
.meta b { color: var(--amber); font-weight: 400; }
.flags { display: flex; gap: 8px; }
.flagtag { color: var(--error); border: 1px solid currentColor; border-radius: var(--r-s); padding: 0 6px; line-height: 18px; cursor: help; }
.outtools { margin-left: auto; display: flex; gap: 4px; }
.ib {
  width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  background: none; border: 0; border-radius: var(--r-s); color: var(--text-2);
}
.ib:hover { color: var(--text); background: var(--surface); }
.ib:disabled { color: var(--text-3); background: none; cursor: default; }
.ib.ok { color: var(--success); }

.well { flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--well); position: relative; overflow-anchor: auto; }
.empty {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  color: var(--text-2); font-size: var(--fs-3); text-align: center; padding: 16px;
}
.empty svg.i { width: 28px; height: 28px; color: var(--text-3); }
.empty.bad svg.i, .empty.bad p { color: var(--error); }
.empty p { margin: 0; }

.list { min-width: 100%; width: max-content; padding-bottom: 32px; font: var(--fs-3)/20px var(--mono); }
.wrap .list { width: 100%; }
.blk { border-bottom: 1px solid var(--sep); }
.bh {
  position: sticky; top: 0; left: 0; z-index: 1;
  width: var(--vw, 100%); display: flex; align-items: center;
  background: var(--well); min-height: 32px;
}
.blk.open > .bh { background: #26282A; box-shadow: 0 1px 0 var(--sep); }
.tog {
  flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px;
  height: 32px; padding: 0 8px 0 12px; background: none; border: 0; text-align: left;
  font: var(--fs-3) var(--mono); color: var(--text);
}
.tog:hover { background: rgba(255,255,255,.03); }
.tog .chev { color: var(--text-2); transition: transform 120ms; display: flex; }
.blk.open .tog .chev { transform: rotate(90deg); }
.tog .ix { color: var(--text-2); min-width: 5ch; text-align: right; }
.tog .rc { color: var(--accent-text); font-weight: 600; }
.tog .rm { color: var(--text-2); white-space: nowrap; }
.tog .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 auto; }
.tog .ts { color: var(--text-2); white-space: nowrap; }
.tog .tx { color: var(--amber); }
.bcopy { margin-right: 8px; }

.bb { padding: 8px 0 12px 0; }
.ln { white-space: pre; padding: 0 16px 0 40px; min-height: 20px; }
.wrap .ln {
  white-space: pre-wrap; overflow-wrap: anywhere;
  padding-left: calc(40px + (var(--i) + 2) * 1ch);
  text-indent: calc((var(--i) + 2) * -1ch);
}
bdi { unicode-bidi: isolate; }
.p { color: #8C9292; }
.tg { color: var(--accent-text); }
.an { color: var(--text-2); }
.av, .js { color: var(--green); }
.tx { color: var(--text); }
.cm { color: var(--text-2); font-style: italic; }
.jk { color: var(--text); }
.jn, .jl { color: var(--amber); }
mark { background: rgba(242,100,110,.32); color: inherit; border-radius: 2px; }

/* ---------- drag overlay ---------- */
.drop {
  position: fixed; inset: 0; z-index: 30; background: rgba(33,34,35,.86);
  display: flex; align-items: center; justify-content: center; pointer-events: none;
}
.drop div {
  border: 2px dashed var(--accent); border-radius: var(--r-l); padding: 32px 48px;
  font: 600 var(--fs-5) var(--sans); color: var(--text);
}

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 100%; z-index: 21;
  background: var(--bg); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto;
  display: flex; flex-direction: column;
}
.drawer header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.drawer h2 { margin: 0; font-size: var(--fs-4); font-weight: 700; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-m); padding: 2px; gap: 2px; }
.seg button {
  height: 28px; padding: 0 12px; border: 0; border-radius: var(--r-s); background: none;
  color: var(--text-2-on-surface); font-size: var(--fs-3);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 600; }
.drawer .foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--sep); }
.note { color: var(--text-2); font-size: var(--fs-2); margin: 8px 0 0; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100vh; }
  .work { flex-direction: column; }
  .inpane { flex: none; height: 35vh; min-width: 0; border-bottom: 1px solid var(--border); }
  .split { display: none; }
  .out { min-height: 70vh; min-width: 0; }
  .well { height: 70vh; flex: none; }
}
@media (max-width: 720px) {
  .topbar { flex-wrap: wrap; height: auto; padding: 8px 16px; row-gap: 8px; }
  .btn .bl { display: none; }
  .flag { display: none; }
  .btn { padding: 0 9px; }
  .jobfield { order: 5; flex-basis: 100%; }
  .divider { display: none; }
  .actions { margin-left: auto; }
  .tog .rm, .tog .ts { display: none; }
}
@media (max-width: 560px) {
  .flag { display: none; }
  .pop { min-width: 240px; }
  .pfx { flex-basis: 100%; }
  .ln { padding-left: 16px; }
  .wrap .ln { padding-left: calc(16px + (var(--i) + 2) * 1ch); }
  .fname { max-width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="8" y="8" width="48" height="48" rx="13" fill="var(--accent)"/>
        <g fill="none" stroke="var(--bg)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22.5 23.5 15 32l7.5 8.5"/><path d="M35.5 21.5 28.5 42.5"/><path d="M41.5 23.5 49 32l-7.5 8.5"/>
        </g>
      </svg>
      <span class="name">XML Beautifier</span>
    </div>
    <span class="divider" aria-hidden="true"></span>
    <span class="flag" aria-hidden="true">&#8722;f</span>
    <button id="jobField" class="jobfield" type="button" aria-label="Error XML file"><span class="jn" id="jobName"></span><span class="js" id="jobSize"></span></button>
    <div class="actions">
      <button id="openBtn" class="btn" type="button" title="Open file"><svg class="i" viewBox="0 0 24 24"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg><span class="bl">Open</span></button>
      <button id="copyBtn" class="btn" type="button" disabled title="Copy shown samples"><svg class="i" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg><span class="bl">Copy</span></button>
      <button id="dlBtn" class="btn primary" type="button" disabled title="Download shown samples"><svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg><span class="bl">Download</span></button>
      <button id="gearBtn" class="gear" type="button" aria-label="Settings" aria-haspopup="dialog"><svg class="i" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <input type="file" id="fileInput" accept=".xml,.jtl,text/xml,application/xml" hidden>
  </header>

  <main class="work" id="work">
    <section class="inpane" id="inPane" aria-label="Input">
      <div class="panehead">
        <span class="fname">input</span>
        <span class="meta" id="inMeta"></span>
        <span class="err" id="pasteErr" role="alert" hidden></span>
        <div class="outtools">
          <button id="clearBtn" class="ib" type="button" title="Clear input" aria-label="Clear input" disabled><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          <button id="hideIn" class="ib" type="button" title="Hide input" aria-label="Hide input"><svg class="i" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg></button>
        </div>
      </div>
      <div class="inbody">
        <textarea id="paste" class="editor" spellcheck="false" autocomplete="off" wrap="off" aria-label="Paste XML"></textarea>
        <div id="pasteNote" class="empty" hidden><p id="pasteNoteMsg"></p></div>
      </div>
    </section>
    <div id="split" class="split" role="separator" aria-orientation="vertical" aria-label="Resize input and output" tabindex="0" aria-valuemin="20" aria-valuemax="80"></div>

    <section class="out" aria-label="Output">
      <div class="outhead">
        <button id="showIn" class="ib" type="button" title="Show input" aria-label="Show input" hidden><svg class="i" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg></button>
        <span class="fname" id="outName">output</span>
        <span class="meta" id="meta" aria-live="polite"></span>
        <span class="flags" id="flags"></span>
        <div class="outtools">
          <button id="expandAll" class="ib" type="button" title="Expand all" aria-label="Expand all" disabled><svg class="i" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg></button>
          <button id="collapseAll" class="ib" type="button" title="Collapse all" aria-label="Collapse all" disabled><svg class="i" viewBox="0 0 24 24"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></svg></button>
        </div>
      </div>
      <div class="filterbar" id="filterBar" hidden>
        <div class="pfx"><label class="pfx-l" for="find">find</label><input id="find" class="pfx-i" type="text" spellcheck="false" autocomplete="off"></div>
        <div class="dd" id="codesBox" hidden>
          <button id="codesBtn" class="btn sm" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="codesPop"><span id="codesLbl">All codes</span><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
          <div id="codesPop" class="pop" role="group" aria-label="Response codes" hidden><div id="codes"></div></div>
        </div>
        <label class="check"><input type="checkbox" id="txRows"> Transaction rows</label>
      </div>
      <div id="scroller" class="well">
        <div id="empty" class="empty"><svg class="i" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><p id="emptyMsg">Drop an error XML or paste it.</p></div>
        <div id="list" class="list" role="list"></div>
      </div>
    </section>
  </main>
</div>

<div id="drop" class="drop" hidden><div>Drop XML</div></div>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <header>
    <h2 id="drawerTitle">Settings</h2>
    <button id="drawerClose" class="ib" type="button" aria-label="Close settings"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </header>
  <div class="field">
    <span class="lbl" id="indLbl">Indent</span>
    <div class="seg" role="group" aria-labelledby="indLbl" data-setting="indent">

  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&quot;'; }); }
  function fmtN(n) { return n.toLocaleString('en-US'); }
  function fmtSize(b) { return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }
  function pad(n, w) { n = String(n); while (n.length < w) n = '0' + n; return n; }
  function fmtTime(ms) {
    var d = new Date(ms);
    return pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2) + ':' + pad(d.getSeconds(), 2);
  }
  function fmtDate(ms) {
    var d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1, 2) + '-' + pad(d.getDate(), 2) + ' ' + fmtTime(ms) + '.' + pad(d.getMilliseconds(), 3);
  }

  /* Escape text and wrap Find matches in <mark>. */
  function hl(s) {
    var f = state.find;
    if (!f) return esc(s);
    var low = s.toLowerCase(), out = '', i = 0, k;
    if (low.length !== s.length) return esc(s);
    while ((k = low.indexOf(f, i)) >= 0) {
      out += esc(s.slice(i, k)) + '<mark>' + esc(s.slice(k, k + f.length)) + '</mark>';
      i = k + f.length;
    }
    return out + esc(s.slice(i));
  }

  /* Quoted values: the content is isolated so Arabic runs never reorder the quotes. */
  function quoted(cls, s) {
    if (s.length >= 2 && s[0] === '"' && s[s.length - 1] === '"') {
      return '<span class="' + cls + '">"<bdi>' + hl(s.slice(1, -1)) + '</bdi>"</span>';
    }
    return '<span class="' + cls + '">' + hl(s) + '</span>';
  }

  function lineHtml(line, unit) {
    var ind = line.d * unit;
    var h = '<div class="ln" style="--i:' + ind + '">' + ' '.repeat(ind);
    for (var i = 0; i < line.t.length; i++) {
      var t = line.t[i], cls = t[0], s = t[1];
      if (cls === 'av' || cls === 'js' || cls === 'jk') h += quoted(cls, s);
      else if (cls === 'tx') h += '<span class="tx"><bdi>' + hl(s) + '</bdi></span>';
      else h += '<span class="' + cls + '">' + hl(s) + '</span>';
    }
    return h + '</div>';
  }

  /* ---------- loading ---------- */
  function sniffEncoding(bytes) {
    var head = '';
    for (var i = 0; i < Math.min(bytes.length, 200); i++) head += String.fromCharCode(bytes[i]);
    if (bytes[0] === 0xff && bytes[1] === 0xfe) return 'utf-16le';
    if (bytes[0] === 0xfe && bytes[1] === 0xff) return 'utf-16be';
    var m = /<\?xml[^>]*encoding\s*=\s*["']([A-Za-z0-9._-]+)["']/.exec(head);
    return m ? m[1] : 'utf-8';
  }

  function loadFile(file) {
    if (!file) return;
    setBusy('Reading ' + file.name + '…');
    file.arrayBuffer().then(function (buf) {
      var bytes = new Uint8Array(buf);
      var dec;
      try { dec = new TextDecoder(sniffEncoding(bytes)); } catch (e) { dec = new TextDecoder('utf-8'); }
      var text = C.normEol(dec.decode(bytes));
      var fits = text.length <= INPUT_LIMIT;
      $('paste').value = fits ? text : '';
      $('paste').hidden = !fits;
      $('pasteNoteMsg').textContent = fits ? '' : 'Too large to show here (' + fmtSize(file.size) + ').';
      $('pasteNote').hidden = fits;
      setInputOpen(fits);
      state.name = file.name; state.size = file.size; state.source = 'file';
      run(text);
    }, function () {
      showEmpty('Could not read ' + file.name + '.', true);
    });
  }

  function setBusy(msg) {
    $('meta').textContent = msg;
  }

  var pasteTimer = 0;
  function onPaste() {
    clearTimeout(pasteTimer);
    pasteTimer = setTimeout(function () {
      var v = $('paste').value;
      if (!v.trim()) {
        if (state.source) reset();
        $('clearBtn').disabled = state.source !== 'file';
        return;
      }
      if (state.source !== 'file') { state.name = 'pasted'; state.source = 'paste'; }
      state.size = new Blob([v]).size;
      run(v);
    }, 250);
  }

  function reset() {
    state.doc = null; state.blocks = []; state.items = []; state.shown = []; state.codes = [];
    state.source = null; state.name = ''; state.size = 0; state.warnings = []; state.noBodies = false;
    $('pasteErr').hidden = true;
    $('pasteNote').hidden = true;
    $('paste').hidden = false;
    $('inMeta').textContent = '';
    $('filterBar').hidden = true;
    closeCodes();
    $('codesBox').hidden = true;
    $('list').innerHTML = '';
    $('meta').textContent = '';
    $('flags').innerHTML = '';
    $('outName').textContent = 'output';
    $('jobName').textContent = ''; $('jobSize').textContent = '';
    setEnabled(false);
    $('clearBtn').disabled = true;
    showEmpty('Drop an error XML or paste it.', false);
  }

  function run(text) {
    setBusy('Parsing…');
    setTimeout(function () {
      var doc = C.parseXml(text);
      var b = C.blocksOf(doc);
      $('clearBtn').disabled = false;
      $('jobName').textContent = state.name;
      $('jobSize').textContent = fmtSize(state.size);
      $('inMeta').textContent = fmtSize(state.size) + ' · ' + fmtN(lineCount(text)) + ' lines';
      $('outName').textContent = state.source === 'file' ? state.name : 'pasted';
      if (!b.blocks.length) {
        state.doc = null; state.items = []; state.shown = [];
        $('list').innerHTML = ''; $('codesBox').hidden = true; $('filterBar').hidden = true; $('flags').innerHTML = ''; $('meta').textContent = '';
        setEnabled(false);
        var msg = 'No XML elements found.';
        if (state.source) { $('pasteErr').textContent = msg; $('pasteErr').hidden = false; }
        showEmpty(msg, true);
        return;
      }
      $('pasteErr').hidden = true;
      $('filterBar').hidden = false;
      state.doc = doc; state.blocks = b.blocks; state.rootName = b.rootName;
      state.warnings = doc.warnings;
      state.selected = null;
      rebuildItems();
    }, 20);
  }

  /* Items follow the Transaction rows toggle; codes are rebuilt from them. */
  function rebuildItems() {
    var hideTx = !$('txRows').checked;
    var flat = C.flatten(state.blocks, hideTx);
    var all = C.flatten(state.blocks, false);
    state.txCount = all.filter(C.isTransaction).length;
    var autoOpen = flat.length <= EXPAND_LIMIT;
    var http = 0, withBody = 0;
    state.items = flat.map(function (el, k) {
      if (el.name === 'httpSample') { http++; if (C.hasResponseBody(el)) withBody++; }
      if (!expandedMap.has(el)) expandedMap.set(el, autoOpen);
      return { el: el, n: k + 1, code: C.codeOf(el) };
    });
    state.noBodies = http > 0 && withBody === 0;
    buildCodes();
    applyFilter();
  }

  function buildCodes() {
    var map = {};
    state.items.forEach(function (it) {
      var c = it.code;
      if (c.key === '~tx') return;
      var m = map[c.key] || (map[c.key] = { key: c.key, label: c.label, sort: c.sort, n: 0, rm: {} });
      m.n++;
      if (c.key.indexOf('c:') === 0) {
        var rm = C.attr(it.el, 'rm') || '';
        m.rm[rm] = (m.rm[rm] || 0) + 1;
      }
    });
    var list = Object.keys(map).map(function (k) { return map[k]; });
    list.sort(function (a, b) { return a.sort - b.sort || (a.label < b.label ? -1 : 1); });
    list.forEach(function (m) {
      var best = '', bn = 0;
      for (var r in m.rm) if (m.rm[r] > bn) { bn = m.rm[r]; best = r; }
      m.msg = best;
    });
    if (!state.selected) state.selected = {};
    var sel = {};
    list.forEach(function (m) { sel[m.key] = state.selected[m.key] !== false; });
    state.selected = sel;
    state.codes = list;
    var box = $('codesBox');
    if (list.length < 2) { box.hidden = true; return; }
    box.hidden = false;
    var h = '<label class="coderow all"><input type="checkbox" id="codeAll"><span class="c">All</span><span class="m"></span><span class="n">' + fmtN(list.reduce(function (s, m) { return s + m.n; }, 0)) + '</span></label>';
    list.forEach(function (m) {
      h += '<label class="coderow" title="' + esc(m.label + (m.msg ? ' ' + m.msg : '')) + '"><input type="checkbox" data-code="' + esc(m.key) + '"' + (sel[m.key] ? ' checked' : '') + '>' +
        '<span class="c">' + esc(m.label) + '</span><span class="m">' + esc(m.msg) + '</span><span class="n">' + fmtN(m.n) + '</span></label>';
    });
    $('codes').innerHTML = h;
    syncAll();
  }

  function syncAll() {
    var all = $('codeAll');
    if (!all) return;
    var keys = Object.keys(state.selected);
    var on = keys.filter(function (k) { return state.selected[k]; }).length;
    all.checked = on === keys.length;
    all.indeterminate = on > 0 && on < keys.length;
    $('codesLbl').textContent = on === keys.length ? 'All codes' : on + ' of ' + keys.length + ' codes';
  }

  function searchOf(el) {
    var s = searchCache.get(el);
    if (s === undefined) { s = C.searchText(el); searchCache.set(el, s); }
    return s;
  }

  function applyFilter() {
    var f = state.find;
    state.shown = state.items.filter(function (it) {
      if (it.code.key !== '~tx' && state.selected && state.selected[it.code.key] === false) return false;
      if (f && searchOf(it.el).indexOf(f) < 0) return false;
      return true;
    });
    renderList();
    renderMeta();
  }

  function renderMeta() {
    var total = state.items.length, shown = state.shown.length;
    var parts = [];
    parts.push(shown === total ? '<b>' + fmtN(total) + '</b> samples' : '<b>' + fmtN(shown) + '</b> of ' + fmtN(total) + ' samples');
    if (state.txCount && !$('txRows').checked) parts.push(fmtN(state.txCount) + ' transaction rows hidden');
    if (state.rootName) parts.push('&lt;' + esc(state.rootName) + '&gt;');
    $('meta').innerHTML = parts.join(' · ');
    var flags = [];
    if (state.warnings.indexOf('truncated') >= 0) flags.push(['Truncated', 'The file ends before its closing tags. The last sample may be incomplete.']);
    if (state.warnings.indexOf('mismatch') >= 0) flags.push(['Not well-formed', 'Some tags or attributes are broken (e.g. a value with an unescaped quote, or a closing tag that does not match). Output for those lines may be wrong.']);
    if (state.noBodies) flags.push(['No response bodies', 'No sample has a response body. Distributed runs drop them unless sample_sender_strip_also_on_error=false is set on every load generator.']);
    $('flags').innerHTML = flags.map(function (f) { return '<span class="flagtag" tabindex="0" title="' + esc(f[1]) + '">' + esc(f[0]) + '</span>'; }).join('');
    setEnabled(shown > 0);
  }

  function setEnabled(on) {
    $('copyBtn').disabled = !on; $('dlBtn').disabled = !on;
    $('expandAll').disabled = !on; $('collapseAll').disabled = !on;
  }

  function showEmpty(msg, bad) {
    $('emptyMsg').textContent = msg;
    $('empty').classList.toggle('bad', !!bad);
    $('empty').hidden = false;
  }

  /* ---------- list rendering (lazy bodies) ---------- */
  var io = null;
  function shortLabel(lb) {
    var m = /^https?:\/\/[^/]+(\/.*)?$/i.exec(lb);
    return m ? (m[1] || '/') : lb;
  }

  function headerHtml(it, idx) {
    var el = it.el, open = expandedMap.get(el);
    var h = '<span class="chev"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span><span class="ix">#' + it.n + '</span>';
    var lb = C.attr(el, 'lb'), ts = C.attr(el, 'ts'), title = [];
    if (C.isTransaction(el)) {
      h += '<span class="tx">TX</span><span class="lb"><bdi>' + esc(lb || '') + '</bdi></span>';
      title.push(lb || '');
    } else if (el.name === 'httpSample' || el.name === 'sample') {
      var rc = C.attr(el, 'rc') || '', rm = C.attr(el, 'rm') || '';
      if (it.code.key.indexOf('x:') === 0) h += '<span class="rc">' + esc(it.code.label) + '</span>';
      else { h += '<span class="rc">' + esc(rc || '—') + '</span>'; if (rm) h += '<span class="rm">' + esc(rm) + '</span>'; }
      h += '<span class="lb"><bdi>' + esc(shortLabel(lb || '')) + '</bdi></span>';
      title.push(rc + (rm ? ' ' + rm : ''), lb || '');
    } else {
      var first = el.attrs[0];
      h += '<span class="rc">' + esc(el.name) + '</span><span class="lb"><bdi>' + (first ? esc(first[0] + '="' + first[1] + '"') : '') + '</bdi></span>';
      title.push(el.name);
    }
    if (ts && /^\d{10,}$/.test(ts)) { h += '<span class="ts">' + fmtTime(+ts) + '</span>'; title.push(fmtDate(+ts)); }
    var tn = C.attr(el, 'tn'); if (tn) title.push(tn);
    var hn = C.attr(el, 'hn'); if (hn) title.push(hn);
    return '<div class="blk' + (open ? ' open' : '') + '" role="listitem" data-k="' + idx + '"><div class="bh">' +
      '<button class="tog" type="button" aria-expanded="' + open + '" aria-controls="bb' + idx + '" title="' + esc(title.join('\n')) + '">' + h + '</button>' +
      '<button class="ib bcopy" type="button" aria-label="Copy sample ' + it.n + '" title="Copy sample"><svg class="i" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>' +
      '</div><div class="bb" id="bb' + idx + '"' + (open ? '' : ' hidden') + '></div></div>';
  }

  function estimate(it) {
    if (!it.lines) it.lines = C.elementLines(it.el, 0, [], opts()).length;
    return it.lines * LINE_H + 20;
  }

  function renderList() {
    if (io) io.disconnect();
    var list = $('list');
    if (!state.shown.length) {
      list.innerHTML = '';
      if (state.doc) showEmpty('No samples match.', false);
      return;
    }
    $('empty').hidden = true;
    var html = '';
    for (var i = 0; i < state.shown.length; i++) html += headerHtml(state.shown[i], i);
    list.innerHTML = html;
    io = new IntersectionObserver(onIntersect, { root: $('scroller'), rootMargin: '1200px 0px' });
    var bodies = list.children;
    for (var k = 0; k < bodies.length; k++) {
      var it = state.shown[k];
      it.rendered = false;
      if (expandedMap.get(it.el)) placeBody(bodies[k].lastChild, it);
    }
    setVw();
  }

  function placeBody(bb, it) {
    bb.hidden = false;
    bb.innerHTML = '';
    bb.style.height = (it.h || estimate(it)) + 'px';
    it.rendered = false;
    io.observe(bb);
  }

  function fillBody(bb, it) {
    var lines = C.elementLines(it.el, 0, [], opts());
    it.lines = lines.length;
    var unit = settings.indent, h = '';
    for (var i = 0; i < lines.length; i++) h += lineHtml(lines[i], unit);
    bb.innerHTML = h;
    bb.style.height = '';
    it.rendered = true;
  }

  function onIntersect(entries) {
    entries.forEach(function (e) {
      var bb = e.target, k = +bb.parentNode.getAttribute('data-k'), it = state.shown[k];
      if (!it || !expandedMap.get(it.el)) return;
      if (e.isIntersecting && !it.rendered) fillBody(bb, it);
      else if (!e.isIntersecting && it.rendered) {
        it.h = bb.offsetHeight;
        bb.style.height = it.h + 'px';
        bb.innerHTML = '';
        it.rendered = false;
      }
    });
  }

  function toggle(k, force) {
    var it = state.shown[k];
    var blk = $('list').children[k];
    var open = force === undefined ? !expandedMap.get(it.el) : force;
    expandedMap.set(it.el, open);
    blk.classList.toggle('open', open);
    blk.querySelector('.tog').setAttribute('aria-expanded', String(open));
    var bb = blk.lastChild;
    if (open) placeBody(bb, it);
    else { io.unobserve(bb); bb.hidden = true; bb.innerHTML = ''; bb.style.height = ''; it.rendered = false; }
  }

  function setAll(open) {
    state.shown.forEach(function (it) { expandedMap.set(it.el, open); });
    var top = $('scroller').scrollTop;
    renderList();
    if (!open) $('scroller').scrollTop = Math.min(top, $('scroller').scrollHeight);
  }

  function setVw() { $('list').style.setProperty('--vw', $('scroller').clientWidth + 'px'); }

  /* Settings that change the output re-render it from scratch. */
  function rerender() {
    state.items.forEach(function (it) { it.lines = 0; it.h = 0; });
    if (state.doc) renderList();
  }

  /* ---------- copy / download ---------- */
  function shownText() {
    var o = opts();
    return state.shown.map(function (it) { return C.blockText(it.el, o); }).join('\n\n') + '\n';
  }

  function copyText(text, btn) {
    var done = function () { flash(btn); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text) && done(); });
    } else if (legacyCopy(text)) done();
  }
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }
  function flash(btn) {
    btn.classList.add('ok');
    var lbl = btn.querySelector('.bl'), old = lbl && lbl.textContent;
    if (lbl) lbl.textContent = 'Copied';
    setTimeout(function () { btn.classList.remove('ok'); if (lbl) lbl.textContent = old; }, 1200);
  }

  function download() {
    var base = state.source === 'file' ? state.name.replace(/\.[^.]+$/, '') : 'pasted';
    var blob = new Blob([shownText()], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = base + '.beautified.txt';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }

  /* ---------- drawer ---------- */
  var lastFocus = null;
  function openDrawer() {
    lastFocus = document.activeElement;
    $('scrim').hidden = false; $('drawer').hidden = false;
    var first = $('drawer').querySelector('.seg button');
    if (first) first.focus();
  }
  function closeDrawer() {
    $('scrim').hidden = true; $('drawer').hidden = true;
    if (lastFocus) lastFocus.focus();
  }

  function lineCount(t) {
    var n = 1, i = -1;
    while ((i = t.indexOf('\n', i + 1)) >= 0) n++;
    return n;
  }

  /* ---------- input pane and divider ---------- */
  function applySplit() {
    $('work').style.setProperty('--inw', settings.split + '%');
    $('split').setAttribute('aria-valuenow', String(Math.round(settings.split)));
  }
  function setInputOpen(open) {
    $('work').classList.toggle('nosplit', !open);
    $('showIn').hidden = open;
    setVw();
  }
  function initSplit() {
    var sp = $('split'), work = $('work');
    function toPct(x) {
      var r = work.getBoundingClientRect();
      var px = Math.min(Math.max(x - r.left, 240), r.width - 320);
      return Math.min(80, Math.max(20, px / r.width * 100));
    }
    sp.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      sp.setPointerCapture(e.pointerId);
      sp.classList.add('drag'); document.body.classList.add('resizing');
      function move(ev) { settings.split = toPct(ev.clientX); applySplit(); setVw(); }
      function up() {
        sp.removeEventListener('pointermove', move); sp.removeEventListener('pointerup', up);
        sp.classList.remove('drag'); document.body.classList.remove('resizing');
        saveSettings();
      }
      sp.addEventListener('pointermove', move); sp.addEventListener('pointerup', up);
    });
    sp.addEventListener('dblclick', function () { settings.split = DEFAULTS.split; applySplit(); saveSettings(); setVw(); });
    sp.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowLeft' ? -2 : e.key === 'ArrowRight' ? 2 : 0;
      if (!d) return;
      e.preventDefault();
      settings.split = Math.min(80, Math.max(20, settings.split + d));
      applySplit(); saveSettings(); setVw();
    });
  }

  /* ---------- response-code dropdown ---------- */
  function openCodes() { $('codesPop').hidden = false; $('codesBtn').setAttribute('aria-expanded', 'true'); var f = $('codesPop').querySelector('input'); if (f) f.focus(); }
  function closeCodes() { $('codesPop').hidden = true; $('codesBtn').setAttribute('aria-expanded', 'false'); }

  /* ---------- wiring ---------- */
  function init() {
    drawFavicon();
    syncSettingsUi();
    reset();

    $('openBtn').addEventListener('click', function () { $('fileInput').click(); });
    $('jobField').addEventListener('click', function () { $('fileInput').click(); });
    $('fileInput').addEventListener('change', function (e) { loadFile(e.target.files[0]); e.target.value = ''; });
    $('paste').addEventListener('input', onPaste);
    /* Browsers turn each CR in pasted text into its own line break, so CR CR LF
       (common from Windows tools) would paste as a blank line after every line. */
    $('paste').addEventListener('paste', function (e) {
      var t = e.clipboardData && e.clipboardData.getData('text/plain');
      if (!t || t.indexOf('\r') < 0) return;
      e.preventDefault();
      var ta = $('paste');
      ta.setRangeText(C.normEol(t), ta.selectionStart, ta.selectionEnd, 'end');
      ta.dispatchEvent(new Event('input'));
    });
    $('clearBtn').addEventListener('click', function () { $('paste').value = ''; reset(); setInputOpen(true); $('paste').focus(); });
    $('hideIn').addEventListener('click', function () { setInputOpen(false); $('showIn').focus(); });
    $('showIn').addEventListener('click', function () { setInputOpen(true); $('hideIn').focus(); });
    initSplit();
    $('codesBtn').addEventListener('click', function () { if ($('codesPop').hidden) openCodes(); else closeCodes(); });
    document.addEventListener('click', function (e) { if (!$('codesPop').hidden && !e.target.closest('#codesBox')) closeCodes(); });

    var findTimer = 0;
    $('find').addEventListener('input', function () {
      clearTimeout(findTimer);
      findTimer = setTimeout(function () {
        state.find = $('find').value.toLowerCase();
        if (state.doc) applyFilter();
      }, 200);
    });
    $('txRows').addEventListener('change', function () { if (state.doc) rebuildItems(); });
    $('codes').addEventListener('change', function (e) {
      var t = e.target;
      if (t.id === 'codeAll') {
        for (var k in state.selected) state.selected[k] = t.checked;
        $('codes').querySelectorAll('input[data-code]').forEach(function (c) { c.checked = t.checked; });
      } else if (t.hasAttribute('data-code')) state.selected[t.getAttribute('data-code')] = t.checked;
      syncAll();
      applyFilter();
    });

    $('list').addEventListener('click', function (e) {
      var blk = e.target.closest('.blk');
      if (!blk) return;
      var k = +blk.getAttribute('data-k');
      if (e.target.closest('.bcopy')) {
        var b = e.target.closest('.bcopy');
        copyText(C.blockText(state.shown[k].el, opts()) + '\n', b);
      } else if (e.target.closest('.tog')) toggle(k);
    });
    $('expandAll').addEventListener('click', function () { setAll(true); });
    $('collapseAll').addEventListener('click', function () { setAll(false); });
    $('copyBtn').addEventListener('click', function () { copyText(shownText(), $('copyBtn')); });
    $('dlBtn').addEventListener('click', download);

    $('gearBtn').addEventListener('click', openDrawer);
    $('drawerClose').addEventListener('click', closeDrawer);
    $('scrim').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !$('drawer').hidden) closeDrawer();
      else if (e.key === 'Escape' && !$('codesPop').hidden) { closeCodes(); $('codesBtn').focus(); }
    });
    $('drawer').addEventListener('click', function (e) {
      var b = e.target.closest('.seg button');
      if (!b) return;
      var k = b.parentNode.getAttribute('data-setting'), v = b.getAttribute('data-v');
      settings[k] = k === 'indent' ? +v : v;
      saveSettings(); syncSettingsUi(); rerender();
    });
    $('drawer').addEventListener('change', function (e) {
      var k = e.target.getAttribute('data-setting');
      if (!k) return;
      settings[k] = e.target.checked;
      saveSettings(); syncSettingsUi(); rerender();
    });
    $('resetBtn').addEventListener('click', function () {
      settings = JSON.parse(JSON.stringify(DEFAULTS));
      saveSettings(); syncSettingsUi(); rerender();
    });

    /* drag and drop anywhere */
    var depth = 0;
    window.addEventListener('dragenter', function (e) {
      if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') < 0) return;
      e.preventDefault(); depth++; $('drop').hidden = false;
    });
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('dragleave', function () { depth = Math.max(0, depth - 1); if (!depth) $('drop').hidden = true; });
    window.addEventListener('drop', function (e) {
      e.preventDefault(); depth = 0; $('drop').hidden = true;
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) loadFile(f);
    });

    if (window.ResizeObserver) new ResizeObserver(setVw).observe($('scroller'));
  }

  init();
})();

</script>
</body>
</html>
